<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFmpeg Web Assembly Test</title>
    <!-- Embedded CSS to bypass cross-origin security policy issues -->
    <style>
        /* Base styles from Tailwind's Preflight */
        *, ::before, ::after { box-sizing: border-box; border-width: 0; border-style: solid; border-color: #e5e7eb; }
        ::before, ::after { --tw-content: ''; }
        html { line-height: 1.5; -webkit-text-size-adjust: 100%; font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"; }
        body { margin: 0; line-height: inherit; }
        
        /* Custom styles based on Tailwind classes */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            background-color: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            row-gap: 1.5rem; /* space-y-6 equivalent */
        }
        .text-3xl { font-size: 1.875rem; line-height: 2.25rem; }
        .font-bold { font-weight: 700; }
        .text-gray-800 { color: #1f2937; }
        .w-full { width: 100%; }
        .text-gray-700 { color: #374151; }
        .bg-gray-100 { background-color: #f3f4f6; }
        .p-2 { padding: 0.5rem; }
        .rounded-lg { border-radius: 0.5rem; }
        .border { border-width: 1px; }
        .border-gray-300 { border-color: #d1d5db; }
        .focus\:outline-none:focus { outline: 2px solid transparent; outline-offset: 2px; }
        .focus\:ring-2:focus { --tw-ring-offset-shadow: var(--tw-ring-inset) 0 0 0 var(--tw-ring-offset-width) var(--tw-ring-offset-color); --tw-ring-shadow: var(--tw-ring-inset) 0 0 0 calc(2px + var(--tw-ring-offset-width)) var(--tw-ring-color); box-shadow: var(--tw-ring-offset-shadow), var(--tw-ring-shadow), var(--tw-shadow, 0 0 #0000); }
        .focus\:ring-blue-500:focus { --tw-ring-color: #3b82f6; }
        .bg-blue-600 { background-color: #2563eb; }
        .hover\:bg-blue-700:hover { background-color: #1d4ed8; }
        .text-white { color: #ffffff; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .shadow-md { --tw-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow); }
        .transition-colors { transition-property: background-color, border-color, color, fill, stroke; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 150ms; }
        .duration-200 { transition-duration: 200ms; }
        #message-box {
            min-height: 3rem;
            background-color: #f3f4f6;
            border-radius: 0.5rem;
            padding: 0.75rem;
            text-align: center;
            font-size: 0.875rem;
            color: #4b5563;
        }
        .hidden { display: none; }
        .text-xl { font-size: 1.25rem; line-height: 1.75rem; }
        .font-semibold { font-weight: 600; }
        .mt-4 { margin-top: 1rem; }
        .mt-2 { margin-top: 0.5rem; }
        .max-w-full { max-width: 100%; }
        .h-auto { height: auto; }
        .inline-block { display: inline-block; }
        .bg-green-600 { background-color: #059669; }
        .hover\:bg-green-700:hover { background-color: #047857; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-3xl font-bold text-gray-800">Video Processor</h1>
        <input type="file" id="video-input" accept="video/*" class="w-full text-gray-700 bg-gray-100 p-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button id="process-button" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition-colors duration-200">
            Convert to GIF
        </button>
        <div id="message-box">Status: Ready</div>
        <div id="output-container" class="hidden">
            <h2 class="text-xl font-semibold text-gray-800 mt-4">Output:</h2>
            <img id="output-image" src="#" alt="Processed GIF" class="mt-2 rounded-lg max-w-full h-auto border border-gray-300">
            <a id="download-link" href="#" download="processed.gif" class="mt-4 inline-block bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition-colors duration-200">
                Download GIF
            </a>
        </div>
    </div>

    <!-- Load the FFmpeg library from a CDN. This version exposes a global `FFmpeg` object. -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.9.7/dist/ffmpeg.min.js"></script>

    <script>
        // Use a global variable to store the FFmpeg instance
        let ffmpeg = null;

        /**
         * Writes a status message to the message box UI element.
         * @param {string} message The message to display.
         */
        const log = (message) => {
            document.getElementById('message-box').innerText = `Status: ${message}`;
            console.log(message);
        };

        /**
         * Initializes the FFmpeg instance and loads the core.
         */
        const initializeFFmpeg = async () => {
            log('Initializing FFmpeg...');
            // In this version (0.9.7), FFmpeg is a global object. We call its createFFmpeg method.
            ffmpeg = FFmpeg.createFFmpeg({ log: true });
            try {
                // The `load()` method must be called to load the FFmpeg core.
                await ffmpeg.load();
                log('FFmpeg loaded successfully!');
            } catch (error) {
                log(`Failed to load FFmpeg: ${error.message}`);
                console.error('FFmpeg load error:', error);
            }
        };

        /**
         * Processes the video file when the button is clicked.
         */
        const processVideo = async () => {
            const fileInput = document.getElementById('video-input');
            const file = fileInput.files[0];

            if (!file) {
                log('Please select a video file first.');
                return;
            }

            if (!ffmpeg) {
                log('FFmpeg is not initialized. Please wait a moment and try again.');
                await initializeFFmpeg();
                if (!ffmpeg) return; // Exit if initialization failed again
            }

            try {
                log('Reading file...');
                const { fetchFile } = FFmpeg; // Get the fetchFile utility from the global FFmpeg object
                
                // Write the file to FFmpeg's virtual file system
                ffmpeg.FS('writeFile', file.name, await fetchFile(file));

                log('Converting video to GIF...');
                
                // Run the FFmpeg command
                await ffmpeg.run('-i', file.name, '-t', '2.5', '-ss', '2.0', '-f', 'gif', 'output.gif');

                // Read the output file from FFmpeg's virtual file system
                log('Reading output file...');
                const data = ffmpeg.FS('readFile', 'output.gif');

                // Create a URL for the output data
                const url = URL.createObjectURL(new Blob([data.buffer], { type: 'image/gif' }));
                
                // Display the output and a download link
                document.getElementById('output-image').src = url;
                document.getElementById('download-link').href = url;
                document.getElementById('output-container').classList.remove('hidden');

                log('Conversion successful! See the result below.');
            } catch (error) {
                log(`Conversion failed: ${error.message}`);
                console.error('Conversion error:', error);
            }
        };
        
        // Add event listeners for the button and for the window load event
        document.getElementById('process-button').addEventListener('click', processVideo);
        
        // Initialize FFmpeg on page load.
        window.onload = initializeFFmpeg;

    </script>
</body>
</html>
