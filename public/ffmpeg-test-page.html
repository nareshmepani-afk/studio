<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFmpeg Final Test Page</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; margin: 20px; }
        .log-container { border: 1px solid #ccc; padding: 15px; margin-top: 20px; background-color: #f9f9f9; }
        .log-entry { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px dashed #eee; }
        .log-entry:last-child { border-bottom: none; }
        .log-success { color: green; font-weight: bold; }
        .log-failure { color: red; font-weight: bold; }
        .log-info { color: blue; }
        .log-debug { color: gray; }
        h1, h2 { color: #333; }
    </style>
</head>
<body>
    <h1>FFmpeg Final Test Page</h1>

    <div class="log-container">
        <h2>Test Log</h2>
        <div id="log"></div>
    </div>

    <!-- 
      Based on our research, the 'ffmpeg.js' file is an ES module
      that does not export anything. Its purpose is to attach the
      'createFFmpeg' function to the global 'window' object.
      
      Therefore, we must load it with a regular <script> tag and
      NOT with 'type="module"'.
    -->
    <script src="./ffmpeg/ffmpeg.js"></script>

    <!-- The rest of our code will now run in a separate script tag. -->
    <script>
        const logElement = document.getElementById('log');

        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = 'log-entry log-' + type;
            entry.textContent = message;
            if (logElement) {
                logElement.appendChild(entry);
            }
            console.log(`[${type.toUpperCase()}] ${message}`);
        }
        
        window.onerror = function(message, source, lineno, colno, error) {
            log(`[UNCAUGHT ERROR] ${message} at ${source}:${lineno}:${colno}`, 'failure');
            console.error(error);
        };

        async function runTests() {
            log('Test 1: Checking for Cross-Origin Isolation...');
            if (window.crossOriginIsolated) {
                log('SUCCESS: Page is Cross-Origin Isolated.', 'success');
            } else {
                log('FAILURE: Page is NOT Cross-Origin Isolated.', 'failure');
                log('Cross-Origin Isolation is required for FFmpeg WASM. Ensure required headers are set.', 'info');
            }

            log('Test 2: Attempting FFmpeg instance creation and load...');
            try {
                // Now, we check for 'createFFmpeg' on the global window object.
                if (typeof window.createFFmpeg !== 'function') {
                    throw new Error('createFFmpeg function is not available on the global window object. The script may not have loaded correctly.');
                }
                
                const ffmpegInstance = window.createFFmpeg({
                    log: true, 
                    coreURL: './ffmpeg/ffmpeg-core.js?v=2025/08/17-09.06',
                    wasmURL: './ffmpeg/ffmpeg-core.wasm?v=2025/08/17-09.06',
                    workerURL: './ffmpeg/ffmpeg-core.worker.js?v=2025/08/17-09.06',
                });

                log('Attempting to load FFmpeg core files...');
                await ffmpegInstance.load();

                log('SUCCESS: FFmpeg instance created and loaded successfully.', 'success');
            } catch (error) {
                log(`FATAL: Failed to create FFmpeg instance: ${error.message}`, 'failure');
            }
            log('FFmpeg final tests finished.', 'info');
        }

        window.addEventListener('DOMContentLoaded', runTests);
    </script>
</body>
</html>
