<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFmpeg Advanced Test Page</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; margin: 20px; }
        .log-container { border: 1px solid #ccc; padding: 15px; margin-top: 20px; background-color: #f9f9f9; }
        .log-entry { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px dashed #eee; }
        .log-entry:last-child { border-bottom: none; }
        .log-success { color: green; font-weight: bold; }
        .log-failure { color: red; font-weight: bold; }
        .log-info { color: blue; }
        h1, h2 { color: #333; }
    </style>
</head>
<script src="/ffmpeg/ffmpeg.js?v=2025/08/17-09.06"></script>
<body>
    <h1>FFmpeg Advanced Test Page</h1>
    <p>This page performs detailed checks for FFmpeg loading and initialization.</p>
    <div class="log-container">
        <h2>Test Log</h2>
        <div id="log"></div>
    </div>

    <script>
        const logElement = document.getElementById('log');

        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = 'log-entry log-' + type;
            entry.textContent = message;
            logElement.appendChild(entry);
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        async function runTests() {
            log('Starting FFmpeg advanced tests...', 'info');

            // Test 1: Check Cross-Origin Isolation
            log('Test 1: Checking Cross-Origin Isolation...');
            if (window.crossOriginIsolated) {
                log('SUCCESS: Page is Cross-Origin Isolated.', 'success');
            } else {
                log('FAILURE: Page is NOT Cross-Origin Isolated.', 'failure');
                log('Cross-Origin Isolation is required for FFmpeg WASM. Ensure required headers are set.', 'info');
            }

            // Test 2: Dynamically load script from UNPKG and check window.FFmpegWASM
            log('Test 2: Dynamically loading script from UNPKG and checking window.FFmpeg...');
            const unpkgUrl = 'https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/umd/ffmpeg.js';
            try {
                const script = document.createElement('script');
                await new Promise((resolve, reject) => {
                    script.onload = () => {
                         log(`SUCCESS: Script loaded dynamically from ${unpkgUrl}.`, 'success');
                         resolve();
                    };
                    script.onerror = () => {
                         log(`FAILURE: Script failed to load dynamically from ${unpkgUrl}.`, 'failure');
                         reject(new Error(`Failed to load script from ${unpkgUrl}`));
                    };
                    document.head.appendChild(script);
 script.src = unpkgUrl;
 script.async = true;
                });

                log('Checking if window.FFmpegWASM and window.FFmpegWASM.createFFmpeg are defined...');
                if (typeof window.FFmpegWASM !== 'undefined' && typeof window.FFmpegWASM.createFFmpeg === 'function') {
                    log('SUCCESS: window.FFmpegWASM and window.FFmpegWASM.createFFmpeg are defined.', 'success');
                } else {
                    log('FATAL: window.FFmpegWASM or window.FFmpegWASM.createFFmpeg are NOT defined after dynamic load.', 'failure');
                    log('This indicates the UNPKG build might not be loading/executing as expected.', 'info');
                }

            } catch (error) {
                log(`FATAL: Error during dynamic script loading: ${error.message}`, 'failure');
            }

            // Test 3: Attempt FFmpeg instance creation and load (if createFFmpeg is available)
            log('Test 3: Attempting FFmpegWASM instance creation and load...');
            if (typeof window.FFmpegWASM !== 'undefined' && typeof window.FFmpegWASM.createFFmpeg === 'function') {
                 try {
                     // Attempt to create and load the FFmpeg instance with specified core paths
                     log('Attempting to create and load FFmpegWASM instance with specified core paths...', 'info');
                     const ffmpeg = window.FFmpegWASM.createFFmpeg({
                         log: true, // Enable logging for debugging load process
                         coreURL: '/ffmpeg/ffmpeg-core.js?v=2025/08/17-09.06',
                         wasmURL: '/ffmpeg/ffmpeg-core.wasm?v=2025/08/17-09.06',
                         workerURL: '/ffmpeg/ffmpeg-core.worker.js?v=2025/08/17-09.06',
                     });

 await ffmpeg.load(); // Attempt to load the core files

                     log('SUCCESS: FFmpegWASM instance created and loaded successfully.', 'success');
                 } catch (error) {
                     log(`FATAL: Failed to create FFmpegWASM instance: ${error.message}`, 'failure');
                 }
            } else {
                 log('Skipping Test 3: window.FFmpegWASM.createFFmpeg not available.', 'info');
            }


            log('FFmpeg advanced tests finished.', 'info');
        }

        runTests();
    </script>
</body>
</html>
