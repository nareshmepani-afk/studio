<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFmpeg Global Load Test Page</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; margin: 20px; }
        .log-container { border: 1px solid #ccc; padding: 15px; margin-top: 20px; background-color: #f9f9f9; }
        .log-entry { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px dashed #eee; }
        .log-entry:last-child { border-bottom: none; }
        .log-success { color: green; font-weight: bold; }
        .log-failure { color: red; font-weight: bold; }
        .log-info { color: blue; }
        .log-debug { color: gray; }
        h1, h2 { color: #333; }
    </style>
</head>
<body>
    <h1>FFmpeg Global Load Test Page</h1>

    <div class="log-container">
        <h2>Test Log</h2>
        <div id="log"></div>
    </div>

    <!-- 
      Based on the last console output, the ffmpeg.js module is empty and
      exports nothing. We must stop trying to use it as a module.

      This is a final attempt to load the library as a classic script.
      By removing the 'type="module"' attribute, we treat the file as a simple
      script that will hopefully create a global 'createFFmpeg' or 'FFmpeg'
      variable for us to use.
    -->
    <script src="./ffmpeg/ffmpeg.js"></script>

    <script>
        const logElement = document.getElementById('log');

        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = 'log-entry log-' + type;
            entry.textContent = message;
            if (logElement) {
                logElement.appendChild(entry);
            }
            console.log(`[${type.toUpperCase()}] ${message}`);
        }
        
        window.onerror = function(message, source, lineno, colno, error) {
            log(`[UNCAUGHT ERROR] ${message} at ${source}:${lineno}:${colno}`, 'failure');
            console.error(error);
        };

        async function runTests() {
            log('Test 1: Checking for Cross-Origin Isolation...');
            if (window.crossOriginIsolated) {
                log('SUCCESS: Page is Cross-Origin Isolated.', 'success');
            } else {
                log('FAILURE: Page is NOT Cross-Origin Isolated.', 'failure');
                log('Cross-Origin Isolation is required for FFmpeg WASM. Ensure required headers are set.', 'info');
            }

            log('Test 2: Checking for global "createFFmpeg" function...');
            if (typeof createFFmpeg === 'function') {
                log('SUCCESS: Found "createFFmpeg" as a global function.', 'success');
                try {
                    const ffmpegInstance = createFFmpeg({
                        log: true, 
                        coreURL: './ffmpeg/ffmpeg-core.js?v=2025/08/17-09.06',
                        wasmURL: './ffmpeg/ffmpeg-core.wasm?v=2025/08/17-09.06',
                        workerURL: './ffmpeg/ffmpeg-core.worker.js?v=2025/08/17-09.06',
                    });

                    log('Attempting to load FFmpeg core files...');
                    await ffmpegInstance.load();

                    log('SUCCESS: FFmpeg instance created and loaded successfully.', 'success');
                } catch (error) {
                    log(`FATAL: Failed to create FFmpeg instance: ${error.message}`, 'failure');
                }
            } else {
                log('FAILURE: The global "createFFmpeg" function was not found. This indicates a problem with the library files or how they are being served.', 'failure');
                log('Please ensure all required FFmpeg library files are present and uncorrupted.', 'info');
            }
            log('FFmpeg final tests finished.', 'info');
        }

        window.addEventListener('DOMContentLoaded', runTests);
    </script>
</body>
</html>
