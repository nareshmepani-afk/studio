<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFmpeg Advanced Test Page</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; margin: 20px; }
        .log-container { border: 1px solid #ccc; padding: 15px; margin-top: 20px; background-color: #f9f9f9; }
        .log-entry { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px dashed #eee; }
        .log-entry:last-child { border-bottom: none; }
        .log-success { color: green; font-weight: bold; }
        .log-failure { color: red; font-weight: bold; }
        .log-info { color: blue; }
        h1, h2 { color: #333; }
    </style>
</head>
<script type="module" src="/ffmpeg/ffmpeg.js?v=2025/08/17-09.06"></script>
<body>
    <h1>FFmpeg Advanced Test Page</h1>
    <p>This page performs detailed checks for FFmpeg loading and initialization.</p>
    <div class="log-container">
        <h2>Test Log</h2>
        <div id="log"></div>
    </div>

    <script type="module">
        import { createFFmpeg } from '/ffmpeg/ffmpeg.js';

        const logElement = document.getElementById('log');

        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = 'log-entry log-' + type;
            entry.textContent = message;
            logElement.appendChild(entry);
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        async function runTests() {
            log('Starting FFmpeg advanced tests...', 'info');

            // Test 1: Check Cross-Origin Isolation
            log('Test 1: Checking Cross-Origin Isolation...');
            if (window.crossOriginIsolated) {
                log('SUCCESS: Page is Cross-Origin Isolated.', 'success');
            } else {
                log('FAILURE: Page is NOT Cross-Origin Isolated.', 'failure');
                log('Cross-Origin Isolation is required for FFmpeg WASM. Ensure required headers are set.', 'info');
            }

            // Test 2: Check for window.FFmpegWASM and attempt instance creation and load
            log('Test 2: Attempting FFmpeg instance creation and load using imported createFFmpeg...');
            log('Assuming ffmpeg.js is loaded via static tag from /ffmpeg/ffmpeg.js.', 'info');
            try {
                // Attempt to create and load the FFmpeg instance with specified core paths
                log('Attempting to create and load FFmpeg instance with specified core paths...', 'info');
                const ffmpeg = createFFmpeg({
                    log: true, // Enable logging for debugging load process
                    coreURL: '/ffmpeg/ffmpeg-core.js?v=2025/08/17-09.06',
                    wasmURL: '/ffmpeg/ffmpeg-core.wasm?v=2025/08/17-09.06',
                    workerURL: '/ffmpeg/ffmpeg-core.worker.js?v=2025/08/17-09.06',
                });

                await ffmpeg.load(); // Attempt to load the core files

                log('SUCCESS: FFmpeg instance created and loaded successfully.', 'success');
            } catch (error) {
                log(`FATAL: Failed to create FFmpeg instance: ${error.message}`, 'failure');
            }

            log('FFmpeg advanced tests finished.', 'info');
        }

        runTests();
    </script>
</body>
</html>
