<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFmpeg Final Test Page</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; margin: 20px; }
        .log-container { border: 1px solid #ccc; padding: 15px; margin-top: 20px; background-color: #f9f9f9; }
        .log-entry { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px dashed #eee; }
        .log-entry:last-child { border-bottom: none; }
        .log-success { color: green; font-weight: bold; }
        .log-failure { color: red; font-weight: bold; }
        .log-info { color: blue; }
        .log-debug { color: gray; }
        h1, h2 { color: #333; }
    </style>
</head>
<body>
    <h1>FFmpeg Final Test Page</h1>

    <p>We are now debugging the module's contents. Please open the developer console and expand the logged object to see what is exported.</p>

    <div class="log-container">
        <h2>Test Log</h2>
        <div id="log"></div>
    </div>

    <!-- 
      Based on the console error, we know that 'ffmpeg.js' is an ES module
      that does NOT have a 'default' export or a named export for 'createFFmpeg'.

      We will now import the entire module as a namespace and log the object to
      the console to see what is actually exported from the module. This is a
      critical debugging step to find the correct function name.
    -->
    <script type="module">
        import * as FFmpegModule from './ffmpeg/ffmpeg.js';

        const logElement = document.getElementById('log');

        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = 'log-entry log-' + type;
            entry.textContent = message;
            if (logElement) {
                logElement.appendChild(entry);
            }
            console.log(`[${type.toUpperCase()}] ${message}`);
        }
        
        window.onerror = function(message, source, lineno, colno, error) {
            log(`[UNCAUGHT ERROR] ${message} at ${source}:${lineno}:${colno}`, 'failure');
            console.error(error);
        };

        async function runTests() {
            log('Test 1: Checking for Cross-Origin Isolation...');
            if (window.crossOriginIsolated) {
                log('SUCCESS: Page is Cross-Origin Isolated.', 'success');
            } else {
                log('FAILURE: Page is NOT Cross-Origin Isolated.', 'failure');
                log('Cross-Origin Isolation is required for FFmpeg WASM. Ensure required headers are set.', 'info');
            }

            log('Test 2: Inspecting FFmpeg module exports...');
            log('Please check your developer console for the logged FFmpegModule object.', 'info');
            
            // This is the key debugging step. We log the entire imported module.
            console.log("FFmpegModule exports:", FFmpegModule);

            if (FFmpegModule && typeof FFmpegModule.createFFmpeg === 'function') {
                log('SUCCESS: Found createFFmpeg function as a named export.', 'success');
                try {
                    const ffmpegInstance = FFmpegModule.createFFmpeg({
                        log: true, 
                        coreURL: './ffmpeg/ffmpeg-core.js?v=2025/08/17-09.06',
                        wasmURL: './ffmpeg/ffmpeg-core.wasm?v=2025/08/17-09.06',
                        workerURL: './ffmpeg/ffmpeg-core.worker.js?v=2025/08/17-09.06',
                    });

                    log('Attempting to load FFmpeg core files...');
                    await ffmpegInstance.load();

                    log('SUCCESS: FFmpeg instance created and loaded successfully.', 'success');
                } catch (error) {
                    log(`FATAL: Failed to create FFmpeg instance: ${error.message}`, 'failure');
                }
            } else {
                log('FAILURE: Could not find "createFFmpeg" function on the FFmpegModule object. The library may have a different export name.', 'failure');
                log('Please report the contents of the FFmpegModule object from your console.', 'info');
            }
            log('FFmpeg final tests finished.', 'info');
        }

        window.addEventListener('DOMContentLoaded', runTests);
    </script>
</body>
</html>
