<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFmpeg Initialization V7 Diagnostics</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; color: #333; padding: 1em; }
        h1 { color: #1a73e8; }
        #log-output {
            background-color: #fff;
            border: 1px solid #ccc;
            padding: 1em;
            margin-top: 1em;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 14px;
            border-radius: 8px;
            max-height: 60vh;
            overflow-y: auto;
        }
        .log-error { color: #d93025; font-weight: bold; }
        .log-success { color: #1e8e3e; font-weight: bold; }
        .log-info { color: #5f6368; }
        .log-step { color: #1a73e8; font-weight: bold; margin-top: 8px; display: block; }
    </style>
    <!-- Static script tag to load ffmpeg.js from the SSR proxy with cache busting -->
    <script src="/api/ffmpeg/ffmpeg.js?v=2025/08/15-15:04"></script>
    <!-- Replace TIMESTAMP with a unique value for each deployment -->
</head>
<body>
    <h1>FFmpeg Diagnostics - V7</h1>
    <p>This page tests the browser\'s ability to load and initialize FFmpeg. The results will be displayed below.</p>
    <div id="log-output"></div>

    <script>
        const logOutputElement = document.getElementById('log-output');

        function logToPage(message, type = 'info') {
            const el = document.createElement('div');
            el.textContent = message;
            if (type === 'error') el.className = 'log-error';
            else if (type === 'success') el.className = 'log-success';
            else if (type === 'step') el.className = 'log-step';
            else el.className = 'log-info';
            logOutputElement.appendChild(el);
            console.log(message); // Also log to actual console
        }

        async function runDiagnostics() {
            logToPage('V7 DIAGNOSTICS: Page loaded and script started.', 'info');

            // --- Step 1: Check for Cross-Origin Isolation ---
            logToPage('Step 1: Checking for Cross-Origin Isolation...', 'step');
            if (window.crossOriginIsolated) {
                logToPage('SUCCESS: Page is Cross-Origin Isolated.', 'success');
            } else {
                logToPage('FAILURE: Page is NOT Cross-Origin Isolated.', 'error');
                logToPage("This is the most likely reason FFmpeg cannot run. The server must send headers: 'Cross-Origin-Opener-Policy: same-origin' and 'Cross-Origin-Embedder-Policy: require-corp'", 'error');
            }

            // --- Step 2: Check for window.FFmpeg object after static script load (with delay) ---
            logToPage('Step 2: Checking for window.FFmpeg object after static script load...', 'step');

            // Add a small delay before checking
            setTimeout(() => {
                if (typeof window.FFmpeg === 'undefined' || typeof window.FFmpeg.createFFmpeg === 'undefined') {
                    logToPage('FATAL: The FFmpeg script loaded but did not define window.FFmpeg.createFFmpeg. This indicates a problem with the script itself or the environment it\'s running in.', 'error');
                     logToPage('Ensure /api/ffmpeg/ffmpeg.js was loaded with correct Cross-Origin Isolation headers.', 'error');
                } else {
                    logToPage('SUCCESS: window.FFmpeg.createFFmpeg object is defined.', 'success');
                    // Proceed to Step 3 if successful
                    runStep3And4();
                }
            }, 2000); // 2000ms delay

           // Create a new function for Step 3 and 4
           async function runStep3And4() {
               // --- Step 3: Attempt to create and load the FFmpeg core ---
               logToPage('Step 3: Attempting to create and load FFmpeg core from API route... (This may take a moment)', 'step');
               try {
                   const { createFFmpeg } = window.FFmpeg;
                   const ffmpeg = createFFmpeg({ log: true });
                   await ffmpeg.load({
                       coreURL: '/api/ffmpeg/ffmpeg-core.js?v=2025/08/15-15:04', // Add cache busting
                       wasmURL: '/api/ffmpeg/ffmpeg-core.wasm?v=2025/08/15-15:04', // Add cache busting
                       workerURL: '/api/ffmpeg/ffmpeg-core.worker.js?v=2025/08/15-15:04', // Add cache busting
                   });
                   logToPage('SUCCESS: FFmpeg core loaded successfully!', 'success');
                   logToPage('FINAL CONCLUSION: Your browser environment appears CAPABLE of running FFmpeg!', 'success');
               } catch (err) {
                   logToPage('FATAL: Failed during ffmpeg.load() execution.', 'error');
                   logToPage(`Error details: ${err.message}`, 'error');
                   logToPage('This usually confirms the lack of Cross-Origin Isolation is blocking the WASM module, or a problem with loading core files from /api/ffmpeg/.', 'error');
               }
           }
        }

        // Initial call to run diagnostics
        setTimeout(runDiagnostics, 2000);

    </script>
</body>
</html>
