<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFmpeg Initialization V7 Diagnostics</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; color: #333; padding: 1em; }
        h1 { color: #1a73e8; }
        #log-output {
            background-color: #fff;
            border: 1px solid #ccc;
            padding: 1em;
            margin-top: 1em;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 14px;
            border-radius: 8px;
            max-height: 60vh;
            overflow-y: auto;
        }
        .log-error { color: #d93025; font-weight: bold; }
        .log-success { color: #1e8e3e; font-weight: bold; }
        .log-info { color: #5f6368; }
        .log-step { color: #1a73e8; font-weight: bold; margin-top: 8px; display: block; }
    </style>
</head>
<body>
    <h1>FFmpeg Diagnostics - V7</h1>
    <p>This page tests the browser's ability to load and initialize FFmpeg. The results will be displayed below.</p>
    <div id="log-output"></div>

    <script>
        const logOutputElement = document.getElementById('log-output');

        function logToPage(message, type = 'info') {
            const el = document.createElement('div');
            el.textContent = message;
            if (type === 'error') el.className = 'log-error';
            else if (type === 'success') el.className = 'log-success';
            else if (type === 'step') el.className = 'log-step';
            else el.className = 'log-info';
            logOutputElement.appendChild(el);
            console.log(message); // Also log to actual console
        }

        async function runDiagnostics() {
            logToPage('V7 DIAGNOSTICS: Page loaded and script started.', 'info');

            // --- Step 1: Check for Cross-Origin Isolation ---
            logToPage('Step 1: Checking for Cross-Origin Isolation...', 'step');
            if (window.crossOriginIsolated) {
                logToPage('SUCCESS: Page is Cross-Origin Isolated.', 'success');
            } else {
                logToPage('FAILURE: Page is NOT Cross-Origin Isolated.', 'error');
                logToPage("This is the most likely reason FFmpeg cannot run. The server must send headers: 'Cross-Origin-Opener-Policy: same-origin' and 'Cross-Origin-Embedder-Policy: require-corp'", 'error');
            }

            // --- Step 2: Dynamically load the FFmpeg script from API route ---
            logToPage('Step 2: Attempting to dynamically load FFmpeg script from API route...', 'step');
            try {
                const script = document.createElement('script');
                script.src = '/api/ffmpeg/ffmpeg.js';

                await new Promise((resolve, reject) => {
                    script.onload = resolve;
                    script.onerror = () => reject(new Error('FFmpeg script failed to load from API route.'));
                    document.head.appendChild(script);
                });
                logToPage('SUCCESS: FFmpeg script loaded from API route.', 'success');
            } catch (error) {
                logToPage(`FATAL: ${error.message}`, 'error');
                return; // Stop if script fails to load
            }

            // --- Step 3: Check for window.FFmpeg object ---
            logToPage('Step 3: Checking for window.FFmpeg object after script load...', 'step');
            if (typeof window.FFmpeg === 'undefined' || typeof window.FFmpeg.createFFmpeg === 'undefined') {
                logToPage('FATAL: The FFmpeg script loaded but did not define window.FFmpeg.createFFmpeg. Execution was likely blocked by the browser due to the missing isolation.', 'error');
                return; // Cannot proceed
            } else {
                logToPage('SUCCESS: window.FFmpeg.createFFmpeg object is defined.', 'success');
            }

            // --- Step 4: Attempt to create and load the FFmpeg core ---
            logToPage('Step 4: Attempting to create and load FFmpeg core from API route... (This may take a moment)', 'step');
            try {
                const { createFFmpeg } = window.FFmpeg;
                const ffmpeg = createFFmpeg({ log: false }); // Disable logs to keep our output clean
                await ffmpeg.load({
                    coreURL: '/api/ffmpeg/ffmpeg-core.js',
                    wasmURL: '/api/ffmpeg/ffmpeg-core.wasm',
                    workerURL: '/api/ffmpeg/ffmpeg-core.worker.js',
                });
                logToPage('SUCCESS: FFmpeg core loaded successfully!', 'success');
                logToPage('FINAL CONCLUSION: Your browser environment appears CAPABLE of running FFmpeg!', 'success');
            } catch (err) {
                logToPage('FATAL: Failed during ffmpeg.load() execution.', 'error');
                logToPage(`Error details: ${err.message}`, 'error');
                logToPage('This usually confirms the lack of Cross-Origin Isolation is blocking the WASM module.', 'error');
            }
        }

        // Run diagnostics after the page has settled
        setTimeout(runDiagnostics, 500);
    </script>
</body>
</html>
