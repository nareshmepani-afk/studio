
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-8">
        <h1 class="text-4xl font-bold mb-4">Video Editor</h1>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div>
                <h2 class="text-2xl font-semibold mb-2">Preview</h2>
                <video id="video-preview" class="w-full rounded-lg shadow-lg" controls autoplay muted playsinline></video>
                <div class="mt-4">
                    <button id="start-recording" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Start Recording</button>
                    <button id="stop-recording" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded" disabled>Stop Recording</button>
                </div>
            </div>
            <div>
                <h2 class="text-2xl font-semibold mb-2">Trim</h2>
                <div class="my-4">
                    <label for="trim-start" class="block text-sm font-medium text-gray-700">Start Time (s)</label>
                    <input type="number" id="trim-start" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" value="0" min="0">
                </div>
                <div class="my-4">
                    <label for="trim-end" class="block text-sm font-medium text-gray-700">End Time (s)</label>
                    <input type="number" id="trim-end" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" value="2" min="0">
                </div>
                <button id="trim-video" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">Trim Video</button>
            </div>
        </div>
        <div class="mt-8">
            <h2 class="text-2xl font-semibold mb-2">Result</h2>
            <video id="trimmed-video-output" class="w-full rounded-lg shadow-lg" controls playsinline></video>
        </div>
        <div id="status-message" class="mt-4 text-lg"></div>
    </div>
    <script type="module">
        import { FFmpeg } from './ffmpeg/ffmpeg.js';
        import { fetchFile, toBlobURL } from './ffmpeg/util.js';

        const videoPreview = document.getElementById('video-preview');
        const startRecordingButton = document.getElementById('start-recording');
        const stopRecordingButton = document.getElementById('stop-recording');
        const trimStartInput = document.getElementById('trim-start');
        const trimEndInput = document.getElementById('trim-end');
        const trimVideoButton = document.getElementById('trim-video');
        const trimmedVideoOutput = document.getElementById('trimmed-video-output');
        const statusMessage = document.getElementById('status-message');

        let ffmpeg;
        let testVideoBlob = null;
        let mediaRecorder;

        const log = (message) => {
            statusMessage.textContent = message;
            console.log(message);
        };

        const initializeFFmpeg = async () => {
            log('Initializing FFmpeg...');
            ffmpeg = new FFmpeg({ log: true });
            
            const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
            const coreURL = await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript');
            const wasmURL = await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm');
            await ffmpeg.load({ coreURL, wasmURL });
            
            log('FFmpeg loaded.');
        };

        const startRecording = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                videoPreview.srcObject = stream;
                let chunks = [];
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) chunks.push(event.data);
                };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    testVideoBlob = blob;
                    videoPreview.srcObject = null;
                    videoPreview.src = URL.createObjectURL(testVideoBlob);
                    stream.getTracks().forEach(track => track.stop());
                    log('Recording stopped. Ready to trim.');
                    stopRecordingButton.disabled = true;
                    startRecordingButton.disabled = false;
                };
                mediaRecorder.start();
                log('Recording started...');
                startRecordingButton.disabled = true;
                stopRecordingButton.disabled = false;
            } catch (e) {
                log(`Error: ${e.message}`);
            }
        };

        const stopRecording = () => {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        };

        trimVideoButton.addEventListener('click', async () => {
            if (!ffmpeg || !ffmpeg.loaded) {
                log('FFmpeg is not loaded.');
                return;
            }
            if (!testVideoBlob) {
                log('No video recorded.');
                return;
            }
            
            const start = parseFloat(trimStartInput.value);
            const end = parseFloat(trimEndInput.value);
            if (isNaN(start) || isNaN(end) || start < 0 || end <= start) {
                log('Invalid trim times.');
                return;
            }
            
            const inputFileName = 'input.webm';
            const outputFileName = 'output.mp4';
            
            try {
                log('Trimming...');
                await ffmpeg.writeFile(inputFileName, await fetchFile(testVideoBlob));
                await ffmpeg.exec(['-i', inputFileName, '-ss', start.toString(), '-to', end.toString(), '-c', 'copy', outputFileName]);
                const data = await ffmpeg.readFile(outputFileName);
                const trimmedBlob = new Blob([data.buffer], { type: 'video/mp4' });
                trimmedVideoOutput.src = URL.createObjectURL(trimmedBlob);
                log('Trimming complete!');
            } catch (e) {
                log(`Error: ${e.message}`);
            }
        });

        startRecordingButton.addEventListener('click', startRecording);
        stopRecordingButton.addEventListener('click', stopRecording);

        initializeFFmpeg();
    </script>
</body>
</html>
