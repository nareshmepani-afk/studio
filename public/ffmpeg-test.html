<!DOCTYPE html>
<html>
<head>
  <title>FFmpeg Local Test</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

  <h1>FFmpeg Local Loading Test - V5 (Header Check)</h1>
  <p>This version explicitly checks for the Cross-Origin Isolated state before attempting to load FFmpeg.</p>
  <div id="status"></div>

  <script>
    const statusDiv = document.getElementById('status');

    function log(message, isError = false) {
      console[isError ? 'error' : 'log'](message);
      const p = document.createElement('p');
      p.textContent = message;
      if (isError) {
        p.style.color = 'red';
      }
      statusDiv.appendChild(p);
    }

    log("Checking for Cross-Origin Isolation...");

    // Check if the page is cross-origin isolated
    if (window.crossOriginIsolated) {
      log("SUCCESS: Page is Cross-Origin Isolated.");
      loadFFmpeg();
    } else {
      log("FAILURE: Page is NOT Cross-Origin Isolated.", true);
      log("This is the reason FFmpeg.wasm cannot run. The server is not sending the required headers: Cross-Origin-Opener-Policy: same-origin and Cross-Origin-Embedder-Policy: require-corp", true);
    }

    async function loadFFmpeg() {
      // Dynamically load the ffmpeg.js script
      log("Loading ffmpeg.js script...");
      const script = document.createElement('script');
      script.src = "/ffmpeg/ffmpeg.js";
      script.onload = async () => {
        log("ffmpeg.js script loaded. Initializing FFmpeg core...");
        if (typeof window.FFmpeg === 'undefined' || typeof window.FFmpeg.createFFmpeg === 'undefined') {
            log("Error: ffmpeg.js loaded but window.FFmpeg.createFFmpeg is not defined.", true);
            return;
        }

        try {
            const { createFFmpeg } = window.FFmpeg;
            const ffmpeg = createFFmpeg({ log: true });

            const LOCAL_FFMPEG_PATH = '/ffmpeg';
            await ffmpeg.load({
                corePath: `${LOCAL_FFMPEG_PATH}/ffmpeg-core.js`,
                workerPath: `${LOCAL_FFMPEG_PATH}/ffmpeg-core.worker.js`,
                wasmPath: `${LOCAL_FFMPEG_PATH}/ffmpeg-core.wasm`,
            });

            log("SUCCESS: FFmpeg instance loaded successfully from local files!");
        } catch (error) {
            log("Error loading FFmpeg instance from local files: " + error, true);
        }
      };
      script.onerror = () => {
        log("Fatal error: Could not load the ffmpeg.js script itself.", true);
      };
      document.body.appendChild(script);
    }
  </script>

</body>
</html>
