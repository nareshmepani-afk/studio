<!DOCTYPE html>
<html>
<head>
  <title>FFmpeg Local Test</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

  <h1>FFmpeg Local Loading Test v2</h1>
  <p>Checking if ffmpeg.js and ffmpeg-core.* files load correctly from the local path.</p>

  <script src="/ffmpeg/ffmpeg.js"></script>

  <script>
    console.log("Attempting to initialize FFmpeg...");

    async function initializeFFmpeg() {
      console.log("Waiting for window.FFmpeg...");
      if (typeof window.FFmpeg === 'undefined') {
        console.error("window.FFmpeg is not defined after script load. The script likely failed to execute. Check for Content Security Policy or other browser errors.");
        return;
      }
      console.log("window.FFmpeg is available.");

      try {
        const { createFFmpeg } = window.FFmpeg;
        const LOCAL_FFMPEG_PATH = '/ffmpeg';
        console.log(`Attempting to create and load FFmpeg instance from corePath: ${LOCAL_FFMPEG_PATH}/ffmpeg-core.js`);

        const ffmpeg = createFFmpeg({
           log: true, // Enable logging to see detailed output
        });

        await ffmpeg.load({
          corePath: `${LOCAL_FFMPEG_PATH}/ffmpeg-core.js`,
          workerPath: `${LOCAL_FFMPEG_PATH}/ffmpeg-core.worker.js`,
          wasmPath: `${LOCAL_FFMPEG_PATH}/ffmpeg-core.wasm`,
        });

        console.log("FFmpeg instance loaded successfully from local files!");

      } catch (error) {
        console.error("CRITICAL ERROR loading FFmpeg instance from local files:", error);
      }
    }

    // Add a delayed check to see if window.FFmpeg becomes available
    setTimeout(() => {
      console.log("Delayed check: Checking for window.FFmpeg after 2 seconds...");
      if (typeof window.FFmpeg !== 'undefined') {
        console.log("Delayed check: window.FFmpeg IS defined. Attempting initialization.");
        initializeFFmpeg();
      } else {
        console.error("Delayed check: window.FFmpeg IS NOT defined.");
      }
    }, 2000);

  </script>

</body>
</html>
