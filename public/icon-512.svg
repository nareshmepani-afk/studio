<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Solid Black Background with Rounded Corners -->
  <rect width="512" height="512" rx="96" fill="#000000"/>
  
  <!-- Exact Official Film Strip Icon (Cyan / Sky Blue) -->
  <g fill="none" stroke="#0ea5e9" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Film Frame -->
    <rect x="96" y="96" width="320" height="320" rx="36"/>
    
    <!-- Vertical Perforation Dividers -->
    <line x1="176" y1="96" x2="176" y2="416"/>
    <line x1="336" y1="96" x2="336" y2="416"/>
    
    <!-- Center Frame Divider -->
    <line x1="96" y1="256" x2="416" y2="256"/>
    
    <!-- Side Sprocket Perforations -->
    <line x1="96" y1="176" x2="176" y2="176"/>
    <line x1="96" y1="336" x2="176" y2="336"/>
    <line x1="336" y1="176" x2="416" y2="176"/>
    <line x1="336" y1="336" x2="416" y2="336"/>
  </g>
</svg>
