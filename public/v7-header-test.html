<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V7 Header Test</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .result { padding: 2rem; border-radius: 8px; font-size: 1.5rem; font-weight: bold; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .failure { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div id="status" class="result">
        Checking...
    </div>
    <script>
        const statusDiv = document.getElementById('status');
        if (window.crossOriginIsolated) {
            statusDiv.textContent = 'Success: crossOriginIsolated is true.';
            statusDiv.classList.add('success');
        } else {
            statusDiv.textContent = 'Failure: crossOriginIsolated is false.';
            statusDiv.classList.add('failure');
        }
    </script>
</body>
</html>
