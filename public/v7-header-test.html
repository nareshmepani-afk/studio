<!DOCTYPE html>
<html>
<head>
  <title>V7 COOP/COEP Test</title>
</head>
<body>
  <h1>V7 Cross-Origin Isolation Test</h1>
  <p>This page checks if the Cross-Origin-Opener-Policy and Cross-Origin-Embedder-Policy headers are correctly applied.</p>
  <p><strong>Status:</strong> <span id="status">Checking...</span></p>
  <script>
    const statusElement = document.getElementById('status');
    if (window.crossOriginIsolated) {
      statusElement.textContent = 'SUCCESS: Cross-origin isolation is enabled.';
      statusElement.style.color = 'green';
    } else {
      statusElement.textContent = 'FAILURE: Cross-origin isolation is NOT enabled.';
      statusElement.style.color = 'red';
    }
  </script>
</body>
</html>
