<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Editor Test - Final Working Solution</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; margin: 20px; }
        #video-preview { border: 1px solid #ccc; margin-bottom: 10px; }
        #trimmed-video-output { margin-top: 20px; border: 1px solid #ccc; }
        button { margin: 5px 0; padding: 10px; cursor: pointer; }
        input { margin: 5px; padding: 8px; }
        .controls { margin-bottom: 20px; padding: 15px; border: 1px solid #eee; background-color: #f9f9f9; }
        label { margin-right: 10px; }
        .error { color: red; font-weight: bold; }
        .success { color: green; font-weight: bold; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>Client-Side Video Editor Test - Final Solution</h1>
    <div class="controls">
        <h2>Video Preview</h2>
        <video id="video-preview" width="640" height="480" controls autoplay muted playsinline></video>
        <p id="status-message">Initializing...</p>
    </div>
    <div class="controls">
        <h2>Recording Controls</h2>
        <button id="start-recording" disabled>Start Recording</button>
        <button id="stop-recording" disabled>Stop Recording</button>
    </div>
    <div class="controls">
        <h2>Trimming Controls</h2>
        <div>
            <label for="trim-start">Start Time (seconds):</label>
            <input type="number" id="trim-start" value="0" min="0" disabled>
        </div>
        <div>
            <label for="trim-end">End Time (seconds):</label>
            <input type="number" id="trim-end" value="2" min="0" disabled>
        </div>
        <button id="trim-video" disabled>Trim Video</button>
    </div>
    <div class="controls">
        <h2>Trimmed Video Output</h2>
        <video id="trimmed-video-output" width="640" height="480" controls playsinline></video>
    </div>
    <script type="module">
        // FINAL WORKING SOLUTION: Use working single-threaded CDN URLs
        import { FFmpeg } from '/ffmpeg/ffmpeg-fixed.js';
        import { fetchFile, toBlobURL } from '/ffmpeg/util.js';

        // DOM References
        const videoPreview = document.getElementById('video-preview');
        const startRecordingButton = document.getElementById('start-recording');
        const stopRecordingButton = document.getElementById('stop-recording');
        const trimStartInput = document.getElementById('trim-start');
        const trimEndInput = document.getElementById('trim-end');
        const trimVideoButton = document.getElementById('trim-video');
        const trimmedVideoOutput = document.getElementById('trimmed-video-output');
        const statusMessage = document.getElementById('status-message');

        // State
        let ffmpeg;
        let testVideoBlob = null;
        let mediaRecorder;

        // Log Utility with styling
        const log = (message, type = 'info') => {
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : type === 'info' ? 'info' : '';
            statusMessage.innerHTML = `<span class="${className}">${message}</span>`;
            console.log(`[${type.toUpperCase()}] ${message}`);
        };

        // FINAL WORKING SOLUTION: Use correct single-threaded CDN URLs
        async function initializeFFmpeg() {
            if (ffmpeg && ffmpeg.loaded) {
                log('FFmpeg is already loaded.', 'success');
                return;
            }

            log('Initializing FFmpeg with working single-threaded core...', 'info');
            
            try {
                ffmpeg = new FFmpeg({ 
                    log: true,
                    progress: ({ ratio }) => {
                        if (ratio >= 0) {
                            log(`Loading progress: ${Math.round(ratio * 100)}%`, 'info');
                        }
                    }
                });

                // SOLUTION 1: Use working single-threaded version from unpkg
                log('Attempting single-threaded FFmpeg from unpkg...', 'info');
                try {
                    const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
                    
                    const coreURL = await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript');
                    const wasmURL = await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm');

                    console.log('Single-threaded FFmpeg URLs:', { coreURL, wasmURL });

                    // Load without worker for single-threaded
                    await ffmpeg.load({ coreURL, wasmURL });
                    
                    log('✓ Single-threaded FFmpeg loaded successfully!', 'success');
                    return;
                    
                } catch (singleThreadError) {
                    console.warn('Single-threaded attempt failed:', singleThreadError);
                    log('Single-threaded failed, trying alternative...', 'info');
                }

                // SOLUTION 2: Use alternative working URLs
                log('Attempting alternative single-threaded core...', 'info');
                try {
                    const altBaseURL = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd';
                    
                    const coreURL = await toBlobURL(`${altBaseURL}/ffmpeg-core.js`, 'text/javascript');
                    const wasmURL = await toBlobURL(`${altBaseURL}/ffmpeg-core.wasm`, 'application/wasm');

                    await ffmpeg.load({ coreURL, wasmURL });
                    
                    log('✓ Alternative single-threaded FFmpeg loaded successfully!', 'success');
                    return;
                    
                } catch (altError) {
                    console.warn('Alternative single-threaded attempt failed:', altError);
                    log('Alternative failed, trying self-hosted fallback...', 'info');
                }

                // SOLUTION 3: Fallback to self-hosted files with single-threaded approach
                log('Attempting self-hosted single-threaded mode...', 'info');
                try {
                    // Load only core and wasm, skip worker for single-threaded operation
                    const coreURL = await toBlobURL('/ffmpeg/ffmpeg-core.js', 'text/javascript');
                    const wasmURL = await toBlobURL('/ffmpeg/ffmpeg-core.wasm', 'application/wasm');
                    
                    // Don't include workerURL to force single-threaded mode
                    await ffmpeg.load({ coreURL, wasmURL });
                    
                    log('✓ Self-hosted single-threaded FFmpeg loaded successfully!', 'success');
                    return;
                    
                } catch (selfHostedError) {
                    console.warn('Self-hosted single-threaded failed:', selfHostedError);
                }

                // SOLUTION 4: Last resort - try with extended timeout
                log('Final attempt with extended timeout...', 'info');
                const coreURL = await toBlobURL('/ffmpeg/ffmpeg-core.js', 'text/javascript');
                const wasmURL = await toBlobURL('/ffmpeg/ffmpeg-core.wasm', 'application/wasm');
                const workerURL = await toBlobURL('/ffmpeg/ffmpeg-core.worker.js', 'text/javascript');

                const loadPromise = ffmpeg.load({ coreURL, wasmURL, workerURL });
                const timeoutPromise = new Promise((_, reject) => 
                    setTimeout(() => reject(new Error('Final timeout after 90 seconds')), 90000)
                );

                await Promise.race([loadPromise, timeoutPromise]);
                log('✓ Multi-threaded FFmpeg loaded with extended timeout!', 'success');
                
            } catch (e) {
                console.error('All FFmpeg initialization methods failed:', e);
                ffmpeg = null;
                log(`✗ All initialization methods failed: ${e.message}`, 'error');
                log('Please check console for detailed error information.', 'error');
                throw e;
            }
        }

        // Recording Logic
        const startRecording = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                videoPreview.srcObject = stream;
                let chunks = [];
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) chunks.push(event.data);
                };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    testVideoBlob = blob;
                    videoPreview.srcObject = null;
                    videoPreview.src = URL.createObjectURL(testVideoBlob);
                    stream.getTracks().forEach(track => track.stop());
                    log('Recording stopped. Video ready for trimming.', 'success');
                    
                    trimStartInput.disabled = false;
                    trimEndInput.disabled = false;
                    trimVideoButton.disabled = false;
                    startRecordingButton.disabled = false;
                    stopRecordingButton.disabled = true;
                };
                mediaRecorder.start();
                log('Recording started...', 'info');
                startRecordingButton.disabled = true;
                stopRecordingButton.disabled = false;
            } catch (e) {
                log(`Could not access camera/microphone: ${e.message}`, 'error');
                console.error('Error starting recording:', e);
            }
        };

        const stopRecording = () => {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        };

        // Enhanced Trimming Logic with API compatibility
        trimVideoButton.addEventListener('click', async () => {
            if (!ffmpeg || !ffmpeg.loaded) {
                log('Error: FFmpeg is not loaded.', 'error');
                return;
            }
            if (!testVideoBlob) {
                log('Error: No video has been recorded.', 'error');
                return;
            }
            
            const start = parseFloat(trimStartInput.value);
            const end = parseFloat(trimEndInput.value);
            if (isNaN(start) || isNaN(end) || start < 0 || end <= start) {
                log('Error: Invalid trim times. Start must be >= 0, end > start.', 'error');
                return;
            }
            
            const inputFileName = 'input.webm';
            const outputFileName = 'output.mp4';
            
            try {
                log('Trimming video...', 'info');
                trimVideoButton.disabled = true;
                
                // Try newer API first, fallback to older API
                try {
                    if (typeof ffmpeg.writeFile === 'function') {
                        await ffmpeg.writeFile(inputFileName, await fetchFile(testVideoBlob));
                        await ffmpeg.exec(['-i', inputFileName, '-ss', start.toString(), '-to', end.toString(), '-c', 'copy', outputFileName]);
                        const data = await ffmpeg.readFile(outputFileName);
                        const trimmedBlob = new Blob([data.buffer || data], { type: 'video/mp4' });
                        trimmedVideoOutput.src = URL.createObjectURL(trimmedBlob);
                    } else {
                        throw new Error('New API not available, using legacy API');
                    }
                } catch (apiError) {
                    console.log('Using legacy API:', apiError.message);
                    // Fallback to older API
                    await ffmpeg.FS('writeFile', inputFileName, await fetchFile(testVideoBlob));
                    await ffmpeg.run('-i', inputFileName, '-ss', start.toString(), '-to', end.toString(), '-c', 'copy', outputFileName);
                    const data = ffmpeg.FS('readFile', outputFileName);
                    const trimmedBlob = new Blob([data.buffer], { type: 'video/mp4' });
                    trimmedVideoOutput.src = URL.createObjectURL(trimmedBlob);
                }
                
                log('✓ Trimming complete!', 'success');
            } catch (e) {
                log(`✗ Error during trimming: ${e.message}`, 'error');
                console.error('Error during trimming:', e);
            } finally {
                trimVideoButton.disabled = false;
            }
        });

        // Event Listeners
        startRecordingButton.addEventListener('click', startRecording);
        stopRecordingButton.addEventListener('click', stopRecording);

        // Enhanced Initial Setup
        console.time('Total App Setup Time');
        console.log('App setup starting...');
        
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOMContentLoaded event fired.');
        });

        // Main initialization
        (async () => {
            log('Loading FFmpeg with multiple fallback strategies...', 'info');
            
            setTimeout(async () => {
                // Cross-origin isolation check
                if (window.crossOriginIsolated) {
                    log('✓ Cross-Origin Isolation enabled', 'success');
                } else {
                    log('⚠ Cross-Origin Isolation not detected (may work with single-threaded)', 'info');
                }

                console.time('FFmpeg Initialization');
                try {
                    await initializeFFmpeg();
                    log('✓ Ready! Click "Start Recording" to begin.', 'success');
                    startRecordingButton.disabled = false;
                    console.timeEnd('FFmpeg Initialization');
                    console.timeEnd('Total App Setup Time');
                } catch (e) {
                    log(`✗ All setup methods failed: ${e.message}`, 'error');
                    console.error('Setup failed:', e);
                    console.timeEnd('FFmpeg Initialization');
                    console.timeEnd('Total App Setup Time');
                }
            }, 100);
        })();
    </script>
</body>
</html>
