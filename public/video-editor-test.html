<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Editor Test</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; margin: 20px; }
        #video-preview { border: 1px solid #ccc; margin-bottom: 10px; }
        #trimmed-video-output { margin-top: 20px; border: 1px solid #ccc; }
        button { margin: 5px 0; padding: 10px; cursor: pointer; }
        input { margin: 5px; padding: 8px; }
        .controls { margin-bottom: 20px; padding: 15px; border: 1px solid #eee; background-color: #f9f9f9; }
        label { margin-right: 10px; }
        .error { color: red; font-weight: bold; }
        .success { color: green; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Client-Side Video Editor Test</h1>
    <div class="controls">
        <h2>Video Preview</h2>
        <video id="video-preview" width="640" height="480" controls autoplay muted playsinline></video>
        <p id="status-message">Initializing...</p>
    </div>
    <div class="controls">
        <h2>Recording Controls</h2>
        <button id="start-recording" disabled>Start Recording</button>
        <button id="stop-recording" disabled>Stop Recording</button>
    </div>
    <div class="controls">
        <h2>Trimming Controls</h2>
        <div>
            <label for="trim-start">Start Time (seconds):</label>
            <input type="number" id="trim-start" value="0" min="0" disabled>
        </div>
        <div>
            <label for="trim-end">End Time (seconds):</label>
            <input type="number" id="trim-end" value="2" min="0" disabled>
        </div>
        <button id="trim-video" disabled>Trim Video</button>
    </div>
    <div class="controls">
        <h2>Trimmed Video Output</h2>
        <video id="trimmed-video-output" width="640" height="480" controls playsinline></video>
    </div>
    <script type="module">
        // Import FFmpeg with error handling
        try {
            var { FFmpeg } = await import('/ffmpeg/ffmpeg.js');
            var { fetchFile, toBlobURL } = await import('https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js');
        } catch (importError) {
            console.error('Failed to import FFmpeg modules:', importError);
            document.getElementById('status-message').innerHTML = '<span class="error">Failed to load FFmpeg modules. Check console for details.</span>';
        }

        // DOM References
        const videoPreview = document.getElementById('video-preview');
        const startRecordingButton = document.getElementById('start-recording');
        const stopRecordingButton = document.getElementById('stop-recording');
        const trimStartInput = document.getElementById('trim-start');
        const trimEndInput = document.getElementById('trim-end');
        const trimVideoButton = document.getElementById('trim-video');
        const trimmedVideoOutput = document.getElementById('trimmed-video-output');
        const statusMessage = document.getElementById('status-message');

        // State
        let ffmpeg;
        let testVideoBlob = null;
        let mediaRecorder;

        // Log Utility with styling
        const log = (message, type = 'info') => {
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : '';
            statusMessage.innerHTML = `<span class="${className}">${message}</span>`;
            console.log(`[${type.toUpperCase()}] ${message}`);
        };

        // Enhanced FFmpeg Initialization with comprehensive error handling
        async function initializeFFmpeg() {
            if (ffmpeg && ffmpeg.loaded) {
                log('FFmpeg is already loaded.', 'success');
                return;
            }

            log('Initializing FFmpeg...');
            
            try {
                ffmpeg = new FFmpeg({ 
                    log: true,
                    // Add progress callback for better user feedback
                    progress: ({ ratio }) => {
                        if (ratio >= 0) {
                            log(`Loading progress: ${Math.round(ratio * 100)}%`);
                        }
                    }
                });

                log('Loading FFmpeg core files with toBlobURL...');

                // Enhanced error handling for each file
                const coreURL = await toBlobURL('/ffmpeg/ffmpeg-core.js', 'text/javascript')
                    .catch(e => {
                        throw new Error(`Failed to load ffmpeg-core.js: ${e.message}`);
                    });
                    
                const wasmURL = await toBlobURL('/ffmpeg/ffmpeg-core.wasm', 'application/wasm')
                    .catch(e => {
                        throw new Error(`Failed to load ffmpeg-core.wasm: ${e.message}`);
                    });
                    
                const workerURL = await toBlobURL('/ffmpeg/ffmpeg-core.worker.js', 'text/javascript')
                    .catch(e => {
                        throw new Error(`Failed to load ffmpeg-core.worker.js: ${e.message}`);
                    });

                console.log('FFmpeg blob URLs created:', { coreURL, wasmURL, workerURL });

                // Add timeout for load operation
                const loadPromise = ffmpeg.load({ coreURL, wasmURL, workerURL });
                const timeoutPromise = new Promise((_, reject) => 
                    setTimeout(() => reject(new Error('FFmpeg load timeout after 30 seconds')), 30000)
                );

                await Promise.race([loadPromise, timeoutPromise]);

                log('FFmpeg loaded successfully!', 'success');
                
            } catch (e) {
                console.error('FFmpeg initialization failed:', e);
                ffmpeg = null;
                log(`FFmpeg initialization failed: ${e.message}`, 'error');
                throw e;
            }
        }

        // Recording Logic (unchanged)
        const startRecording = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                videoPreview.srcObject = stream;
                let chunks = [];
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) chunks.push(event.data);
                };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    testVideoBlob = blob;
                    videoPreview.srcObject = null;
                    videoPreview.src = URL.createObjectURL(testVideoBlob);
                    stream.getTracks().forEach(track => track.stop());
                    log('Recording stopped. Video ready for trimming.', 'success');
                    
                    trimStartInput.disabled = false;
                    trimEndInput.disabled = false;
                    trimVideoButton.disabled = false;
                    startRecordingButton.disabled = false;
                    stopRecordingButton.disabled = true;
                };
                mediaRecorder.start();
                log('Recording started...');
                startRecordingButton.disabled = true;
                stopRecordingButton.disabled = false;
            } catch (e) {
                log(`Could not access camera/microphone: ${e.message}`, 'error');
                console.error('Error starting recording:', e);
            }
        };

        const stopRecording = () => {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        };

        // Enhanced Trimming Logic
        trimVideoButton.addEventListener('click', async () => {
            if (!ffmpeg || !ffmpeg.loaded) {
                log('Error: FFmpeg is not loaded.', 'error');
                return;
            }
            if (!testVideoBlob) {
                log('Error: No video has been recorded.', 'error');
                return;
            }
            
            const start = parseFloat(trimStartInput.value);
            const end = parseFloat(trimEndInput.value);
            if (isNaN(start) || isNaN(end) || start < 0 || end <= start) {
                log('Error: Invalid trim times. Start must be >= 0, end > start.', 'error');
                return;
            }
            
            const inputFileName = 'input.webm';
            const outputFileName = 'output.mp4';
            
            try {
                log('Trimming video...');
                trimVideoButton.disabled = true;
                
                await ffmpeg.FS('writeFile', inputFileName, await fetchFile(testVideoBlob));
                await ffmpeg.run('-i', inputFileName, '-ss', start.toString(), '-to', end.toString(), '-c', 'copy', outputFileName);
                
                const data = ffmpeg.FS('readFile', outputFileName);
                const trimmedBlob = new Blob([data.buffer], { type: 'video/mp4' });
                trimmedVideoOutput.src = URL.createObjectURL(trimmedBlob);
                
                log('Trimming complete!', 'success');
            } catch (e) {
                log(`Error during trimming: ${e.message}`, 'error');
                console.error('Error during trimming:', e);
            } finally {
                trimVideoButton.disabled = false;
            }
        });

        // Event Listeners
        startRecordingButton.addEventListener('click', startRecording);
        stopRecordingButton.addEventListener('click', stopRecording);

        // Enhanced Initial Setup
        console.time('Total App Setup Time');
        console.log('App setup starting...');
        
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOMContentLoaded event fired.');
        });

        // Main initialization with better error handling
        (async () => {
            log('Loading FFmpeg. Please wait...');
            
            setTimeout(async () => {
                // Cross-origin isolation check
                if (window.crossOriginIsolated) {
                    log('✓ Cross-Origin Isolation enabled', 'success');
                } else {
                    log('⚠ Cross-Origin Isolation not detected. FFmpeg may fail.', 'error');
                }

                console.time('FFmpeg Initialization');
                try {
                    await initializeFFmpeg();
                    log('✓ Ready! Click "Start Recording" to begin.', 'success');
                    startRecordingButton.disabled = false;
                    console.timeEnd('FFmpeg Initialization');
                    console.timeEnd('Total App Setup Time');
                } catch (e) {
                    log(`✗ Setup failed: ${e.message}. Please reload the page.`, 'error');
                    console.error('Setup failed:', e);
                    console.timeEnd('FFmpeg Initialization');
                    console.timeEnd('Total App Setup Time');
                }
            }, 100); // Small delay for UI repaint
        })();
    </script>
</body>
</html>
