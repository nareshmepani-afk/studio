<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Editor Test</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; margin: 20px; }
        #video-preview { border: 1px solid #ccc; margin-bottom: 10px; }
        #trimmed-video-output { margin-top: 20px; border: 1px solid #ccc; }
        button { margin: 5px 0; padding: 10px; cursor: pointer; }
        input { margin: 5px; padding: 8px; }
        .controls { margin-bottom: 20px; padding: 15px; border: 1px solid #eee; background-color: #f9f9f9; }
        label { margin-right: 10px; }
        /* Test results styling */
        #test-results { margin-top: 20px; padding: 15px; border: 1px solid #ccc; background-color: #f0f0f0; }
        .test-result { margin-bottom: 10px; padding: 10px; border-bottom: 1px solid #ddd; }
        .test-result.passed { background-color: #d4edda; }
        .test-result.failed { background-color: #f8d7da; }
        .test-title { font-weight: bold; }
        .test-message { margin-top: 5px; }
    </style>
</head>
<body>
    <h1>Client-Side Video Editor Test</h1>

    <div class="controls">
        <h2>Video Preview</h2>
        <video id="video-preview" width="640" height="480" controls autoplay muted playsinline></video>
        <p id="status-message">Initializing...</p>
    </div>

    <div class="controls">
        <h2>Recording Controls</h2>
        <button id="start-recording" disabled>Start Recording</button>
        <button id="stop-recording" disabled>Stop Recording</button>
    </div>

    <div class="controls">
        <h2>Trimming Controls</h2>
        <div>
            <label for="trim-start">Start Time (seconds):</label>
            <input type="number" id="trim-start" value="0" min="0" disabled>
        </div>
        <div>
            <label for="trim-end">End Time (seconds):</label>
            <input type="number" id="trim-end" value="2" min="0" disabled>
        </div>
        <button id="trim-video" disabled>Trim Video</button>
    </div>

    <div class="controls">
        <h2>Trimmed Video Output</h2>
        <video id="trimmed-video-output" width="640" height="480" controls playsinline></video>
    </div>

    <script type="module">
        // The definitive solution: import from self-hosted files with correct headers.
        // The import path is updated to match your specified folder structure.
        import { FFmpeg } from '/ffmpeg/ffmpeg.js';
        import { fetchFile } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js';

        // --- DOM Element References ---
        const videoPreview = document.getElementById('video-preview');
        const startRecordingButton = document.getElementById('start-recording');
        const stopRecordingButton = document.getElementById('stop-recording');
        const trimStartInput = document.getElementById('trim-start');
        const trimEndInput = document.getElementById('trim-end');
        const trimVideoButton = document.getElementById('trim-video');
        const trimmedVideoOutput = document.getElementById('trimmed-video-output');
        const statusMessage = document.getElementById('status-message');

        // --- Global State Variables ---
        let ffmpeg;
        let testVideoBlob = null;
        let mediaRecorder;

        // --- Utility Function for Logging Status ---
        const log = (message) => {
            statusMessage.textContent = message;
            console.log(message);
        };

        // --- Main FFmpeg Initialization Logic ---
        async function initializeFFmpeg() {
            if (ffmpeg && ffmpeg.loaded) {
                log('FFmpeg is already loaded.');
                return;
            }
            log('Initializing FFmpeg...');
            console.log('Creating new FFmpeg instance...');
            ffmpeg = new FFmpeg({ log: true });

            try {
                log('Loading self-hosted FFmpeg core files...');

                // Pointing to the self-hosted files, which will be served with the
                // correct headers via your firebase.json configuration.
                const coreURL = '/ffmpeg/ffmpeg-core.js';
                const wasmURL = '/ffmpeg/ffmpeg-core.wasm';
                const workerURL = '/ffmpeg/ffmpeg-core.worker.js';

                await ffmpeg.load({ coreURL, wasmURL, workerURL });

                console.log('FFmpeg core files loaded successfully.');
                log('FFmpeg loaded successfully.');
            } catch (e) {
                console.error('Failed to load FFmpeg:', e);
                ffmpeg = null;
                log(`Failed to load FFmpeg: ${e.message}`);
                throw new Error('FFmpeg failed to load.');
            }
        }

        // --- Video Recording Logic ---
        const startRecording = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                videoPreview.srcObject = stream;

                let chunks = [];
                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) chunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    testVideoBlob = blob;
                    videoPreview.srcObject = null; // Disconnect the stream from the preview
                    videoPreview.src = URL.createObjectURL(testVideoBlob); // Set recorded video as source
                    stream.getTracks().forEach(track => track.stop()); // Stop camera and microphone
                    log('Recording stopped. Video ready for trimming.');

                    // Enable trimming and test controls
                    trimStartInput.disabled = false;
                    trimEndInput.disabled = false;
                    trimVideoButton.disabled = false;

                    // Re-enable start button, disable stop button
                    startRecordingButton.disabled = false;
                    stopRecordingButton.disabled = true;
                };

                mediaRecorder.start();
                log('Recording started...');
                startRecordingButton.disabled = true;
                stopRecordingButton.disabled = false;

            } catch (e) {
                log(`Could not access camera/microphone: ${e.message}`);
                console.error('Error starting recording:', e);
            }
        };

        const stopRecording = () => {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        };

        // --- Event Listeners for User Actions ---
        startRecordingButton.addEventListener('click', startRecording);
        stopRecordingButton.addEventListener('click', stopRecording);

        trimVideoButton.addEventListener('click', async () => {
            if (!ffmpeg || !ffmpeg.loaded) {
                log('Error: FFmpeg is not loaded.');
                return;
            }
            if (!testVideoBlob) {
                log('Error: No video has been recorded.');
                return;
            }
            const start = parseFloat(trimStartInput.value);
            const end = parseFloat(trimEndInput.value);
            if (isNaN(start) || isNaN(end) || start < 0 || end <= start) {
                log('Error: Invalid trim times. Please enter a positive start time and an end time greater than the start time.');
                return;
            }

            const inputFileName = 'input.webm';
            const outputFileName = 'output.mp4';
            try {
                log('Trimming video...');
                trimVideoButton.disabled = true;
                await ffmpeg.FS('writeFile', inputFileName, await fetchFile(testVideoBlob));
                await ffmpeg.run('-i', inputFileName, '-ss', start.toString(), '-to', end.toString(), '-c', 'copy', outputFileName);
                const data = ffmpeg.FS('readFile', outputFileName);
                const trimmedBlob = new Blob([data.buffer], { type: 'video/mp4' });
                trimmedVideoOutput.src = URL.createObjectURL(trimmedBlob);
                log('Trimming complete!');
            } catch (e) {
                log(`Error during trimming: ${e.message}`);
                console.error('Error during trimming:', e);
            } finally {
                trimVideoButton.disabled = false;
            }
        });

        // --- Initial Application Setup ---
        console.time('Total App Setup Time');
        console.time('DOMContentLoaded');
        console.log('App setup starting...');

        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOMContentLoaded event fired.');
            console.timeEnd('DOMContentLoaded');
        });

        // This pattern ensures the UI has a chance to repaint before we start the
        // heavy, time-consuming process of loading FFmpeg.
        (async () => {
            console.log('Setting loading message and yielding to browser repaint...');
            log('Loading FFmpeg. Please wait...');

            setTimeout(async () => {
                console.log('Resuming FFmpeg initialization after repaint.');
                // Diagnostic check for Cross-Origin Isolation
                if (window.crossOriginIsolated) {
                    log('Success: The page is Cross-Origin Isolated.', 'success');
                } else {
                    log('Warning: The page is NOT Cross-Origin Isolated. FFmpeg may fail to load. Please ensure your server sends the correct headers.', 'warning');
                }

                console.time('Initial Script Execution Time');
                try {
                    await initializeFFmpeg();
                    log('Ready. Click "Start Recording" to begin.');
                    startRecordingButton.disabled = false;
                    console.timeEnd('Initial Script Execution Time');
                    console.timeEnd('Total App Setup Time');
                } catch (e) {
                    log(`Setup failed: ${e.message}. Please reload the page.`);
                    console.error('Setup failed:', e);
                    console.timeEnd('Initial Script Execution Time');
                    console.timeEnd('Total App Setup Time');
                }
            }, 0);
        })();
    </script>
</body>
</html>
