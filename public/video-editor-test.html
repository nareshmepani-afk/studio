<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Editor Test</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; margin: 20px; }
        #video-preview { border: 1px solid #ccc; margin-bottom: 10px; }
        #trimmed-video-output { margin-top: 20px; border: 1px solid #ccc; }
        button { margin: 5px 0; padding: 10px; cursor: pointer; }
        input { margin: 5px; padding: 8px; }
        .controls { margin-bottom: 20px; padding: 15px; border: 1px solid #eee; background-color: #f9f9f9; }
        label { margin-right: 10px; }
        /* Test results styling */
        #test-results { margin-top: 20px; padding: 15px; border: 1px solid #ccc; background-color: #f0f0f0; }
        .test-result { margin-bottom: 10px; padding: 10px; border-bottom: 1px solid #ddd; }
        .test-result.passed { background-color: #d4edda; }
        .test-result.failed { background-color: #f8d7da; }
        .test-title { font-weight: bold; }
        .test-message { margin-top: 5px; }
    </style>
</head>
<body>
    <h1>Client-Side Video Editor Test</h1>

    <div class="controls">
        <h2>Video Preview</h2>
        <video id="video-preview" width="640" height="480" controls autoplay muted></video>
    </div>

    <div class="controls">
        <h2>Recording Controls</h2>
        <button id="start-recording">Start Recording</button>
        <button id="stop-recording" disabled>Stop Recording</button>
    </div>

    <div class="controls">
        <h2>Trimming Controls</h2>
        <div>
            <label for="trim-start">Start Time (seconds):</label>
            <input type="number" id="trim-start" value="0" min="0">
        </div>
        <div>
            <label for="trim-end">End Time (seconds):</label>
            <input type="number" id="trim-end" value="5" min="0">
        </div>
        <button id="trim-video" disabled>Trim Video</button>
    </div>

    <div class="controls">
        <h2>Trimmed Video Output</h2>
        <video id="trimmed-video-output" width="640" height="480" controls></video>
    </div>

    <!-- Test Automation Controls -->
    <div class="controls">
        <h2>Test Automation</h2>
        <button id="run-tests">Run Integration Tests</button>
        <p>Note: This test suite requires user interaction and may fail in a non-interactive environment. Please click "Run Integration Tests" and follow the prompts.</p>
    </div>

    <!-- Test Results Display -->
    <div id="test-results">
        <h2>Test Results</h2>
        <!-- Test results will be dynamically inserted here -->
    </div>

    <script type="module">
        import { FFmpeg } from '/ffmpeg/ffmpeg.js';
        import { fetchFile, toBlobURL } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js';

        // --- Element References ---
        const videoPreview = document.getElementById('video-preview');
        const startRecordingButton = document.getElementById('start-recording');
        const stopRecordingButton = document.getElementById('stop-recording');
        const trimStartInput = document.getElementById('trim-start');
        const trimEndInput = document.getElementById('trim-end');
        const trimVideoButton = document.getElementById('trim-video');
        const trimmedVideoOutput = document.getElementById('trimmed-video-output');
        const runTestsButton = document.getElementById('run-tests');
        const testResultsContainer = document.getElementById('test-results');

        // --- Global State ---
        let mediaRecorder;
        let recordedChunks = [];
        let ffmpeg;

        // --- Test Framework ---
        const testRegistry = [];

        /**
         * Registers a new test case.
         * @param {string} title - The title of the test.
         * @param {Function} testFn - The asynchronous function containing the test logic.
         */
        const registerTest = (title, testFn) => {
            testRegistry.push({ title, testFn });
        };

        /**
         * Displays a test result on the page.
         * @param {string} title - The test title.
         * @param {boolean} passed - Whether the test passed.
         * @param {string} message - The result message.
         */
        const displayTestResult = (title, passed, message) => {
            const resultDiv = document.createElement('div');
            resultDiv.classList.add('test-result');
            resultDiv.classList.add(passed ? 'passed' : 'failed');
            resultDiv.innerHTML = `
                <div class="test-title">${title}</div>
                <div class="test-message">${message}</div>
            `;
            testResultsContainer.appendChild(resultDiv);
        };

        /**
         * Runs all registered tests in sequence.
         */
        const runTests = async () => {
            testResultsContainer.innerHTML = '<h2>Test Results</h2>'; // Clear previous results
            // This is a simple runner; in a real framework, you'd handle setup/teardown more formally.
            
            // Wait for FFmpeg to be ready before running the tests.
            await initializeFFmpeg();

            for (const { title, testFn } of testRegistry) {
                try {
                    await testFn();
                    displayTestResult(title, true, 'Passed');
                } catch (e) {
                    displayTestResult(title, false, `Failed: ${e.message}`);
                }
            }
        };

        runTestsButton.addEventListener('click', runTests);

        // --- Core Application Logic ---
        /**
         * Initializes the FFmpeg instance and loads the core files.
         */
        async function initializeFFmpeg() {
            if (ffmpeg) {
                console.log('FFmpeg is already initialized.');
                return;
            }
            console.log('Initializing FFmpeg...');
            ffmpeg = new FFmpeg({ log: true });
            const corePath = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core-mt@0.12.6/dist/esm';
            try {
                await ffmpeg.load({
                    coreURL: await toBlobURL(`${corePath}/ffmpeg-core.js`, 'text/javascript'),
                    wasmURL: await toBlobURL(`${corePath}/ffmpeg-core.wasm`, 'application/wasm'),
                    workerURL: await toBlobURL(`${corePath}/ffmpeg-core.worker.js`, 'text/javascript'),
                });
                console.log('FFmpeg loaded successfully.');
            } catch (e) {
                console.error('Failed to load FFmpeg:', e);
                ffmpeg = null;
                throw new Error('FFmpeg failed to load. Integration tests cannot proceed.');
            }
        }

        /**
         * Records a video for a specified duration and returns a Blob.
         * @param {number} durationMs - The duration to record in milliseconds.
         * @returns {Promise<Blob>} A promise that resolves with the recorded video Blob.
         */
        const recordVideoForTest = (durationMs) => new Promise(async (resolve, reject) => {
            let chunks = [];
            let stream;
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                const recorder = new MediaRecorder(stream);
                
                recorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        chunks.push(event.data);
                    }
                };

                recorder.onstop = () => {
                    stream.getTracks().forEach(track => track.stop()); // Stop the camera feed
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    resolve(blob);
                };

                recorder.onerror = (e) => {
                    stream.getTracks().forEach(track => track.stop());
                    reject(e);
                };

                recorder.start();
                setTimeout(() => {
                    if (recorder.state !== 'inactive') {
                        recorder.stop();
                    }
                }, durationMs);

            } catch (e) {
                reject(new Error('User media access denied or failed: ' + e.message));
            }
        });

        // --- Test Cases ---
        registerTest('1. FFmpeg Initialization Test', async () => {
            // The runTests function handles this automatically before running other tests.
            // This test case just checks the final state.
            if (!ffmpeg || !ffmpeg.loaded) {
                throw new Error('FFmpeg did not initialize correctly.');
            }
        });

        registerTest('2. Video Recording Test', async () => {
            // Note: This test requires a user to grant camera/mic permissions when it runs.
            // It will fail if permissions are denied.
            console.log('Attempting to record a 3-second video for test...');
            const recordedBlob = await recordVideoForTest(3000);
            
            if (!recordedBlob || recordedBlob.size <= 0) {
                throw new Error('Video recording did not produce any data.');
            }

            // Set the recorded video as the source for the next test
            videoPreview.src = URL.createObjectURL(recordedBlob);
            await new Promise(resolve => videoPreview.onloadeddata = resolve);
        });

        registerTest('3. Video Trimming Test', async () => {
            if (!videoPreview.src) {
                throw new Error('No recorded video from previous test to trim.');
            }
            
            // Set the trim times for the test
            const start = 0;
            const end = 2; // Trim to 2 seconds
            
            // Get the recorded video from the preview element's src
            const videoBlob = await fetch(videoPreview.src).then(r => r.blob());
            const inputFileName = 'input.webm'; 
            const outputFileName = 'output.mp4'; 

            await ffmpeg.FS('writeFile', inputFileName, await fetchFile(videoBlob));
            await ffmpeg.run('-ss', start.toString(), '-to', end.toString(), '-i', inputFileName, '-c', 'copy', outputFileName);
            const data = ffmpeg.FS('readFile', outputFileName);

            const trimmedBlob = new Blob([data.buffer], { type: 'video/mp4' });
            const trimmedUrl = URL.createObjectURL(trimmedBlob);
            trimmedVideoOutput.src = trimmedUrl;
            
            // Wait for the trimmed video to load and check its duration
            await new Promise(resolve => trimmedVideoOutput.onloadeddata = resolve);
            const duration = trimmedVideoOutput.duration;

            // The trimmed video should have a duration of approximately 2 seconds (end - start)
            if (Math.abs(duration - (end - start)) > 0.5) {
                throw new Error(`Trimmed video duration is incorrect: expected ~2s, got ${duration.toFixed(2)}s.`);
            }
            console.log(`Video trimmed successfully. Final duration: ${duration.toFixed(2)}s.`);
        });

        // --- Event Listeners for UI ---
        startRecordingButton.addEventListener('click', async () => {
            // This button now has its own logic for manual recording
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                videoPreview.srcObject = stream;
                mediaRecorder = new MediaRecorder(stream);
                recordedChunks = [];
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    videoPreview.srcObject = null;
                    videoPreview.src = url;
                    if (ffmpeg) {
                        trimVideoButton.disabled = false;
                    }
                };
                mediaRecorder.start();
                startRecordingButton.disabled = true;
                stopRecordingButton.disabled = false;
                trimVideoButton.disabled = true;
                trimmedVideoOutput.removeAttribute('src');
                trimmedVideoOutput.load();
            } catch (e) {
                console.error('Error starting recording:', e);
            }
        });

        stopRecordingButton.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                startRecordingButton.disabled = false;
                stopRecordingButton.disabled = true;
            }
        });

        trimVideoButton.addEventListener('click', async () => {
            if (!ffmpeg) {
                console.error('FFmpeg is not loaded.');
                return;
            }
            const start = parseFloat(trimStartInput.value);
            const end = parseFloat(trimEndInput.value);
            if (isNaN(start) || isNaN(end) || start < 0 || end <= start) {
                console.error('Invalid trim times.');
                return;
            }
            const videoBlob = await fetch(videoPreview.src).then(r => r.blob());
            const inputFileName = 'input.webm';
            const outputFileName = 'output.mp4';
            try {
                await ffmpeg.FS('writeFile', inputFileName, await fetchFile(videoBlob));
                await ffmpeg.run('-ss', start.toString(), '-to', end.toString(), '-i', inputFileName, '-c', 'copy', outputFileName);
                const data = ffmpeg.FS('readFile', outputFileName);
                const trimmedBlob = new Blob([data.buffer], { type: 'video/mp4' });
                const trimmedUrl = URL.createObjectURL(trimmedBlob);
                trimmedVideoOutput.src = trimmedUrl;
                trimmedVideoOutput.load();
                console.log('Trimming complete!');
            } catch (e) {
                console.error('Error during trimming:', e);
            }
        });

    </script>
</body>
</html>
