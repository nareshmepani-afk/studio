<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Editor Test</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; margin: 20px; }
        #video-preview { border: 1px solid #ccc; margin-bottom: 10px; }
        #trimmed-video-output { margin-top: 20px; border: 1px solid #ccc; }
        button { margin: 5px 0; padding: 10px; cursor: pointer; }
        input { margin: 5px; padding: 8px; }
        .controls { margin-bottom: 20px; padding: 15px; border: 1px solid #eee; background-color: #f9f9f9; }
        label { margin-right: 10px; }
    </style>
</head>
<body>
    <h1>Client-Side Video Editor Test</h1>

    <div class="controls">
        <h2>Video Preview</h2>
        <video id="video-preview" width="640" height="480" controls autoplay muted></video>
    </div>

    <div class="controls">
        <h2>Recording Controls</h2>
        <button id="start-recording">Start Recording</button>
        <button id="stop-recording" disabled>Stop Recording</button>
    </div>

    <div class="controls">
        <h2>Trimming Controls</h2>
        <div>
            <label for="trim-start">Start Time (seconds):</label>
            <input type="number" id="trim-start" value="0" min="0">
        </div>
        <div>
            <label for="trim-end">End Time (seconds):</label>
            <input type="number" id="trim-end" value="5" min="0">
        </div>
        <button id="trim-video" disabled>Trim Video</button>
    </div>

    <div class="controls">
        <h2>Trimmed Video Output</h2>
        <video id="trimmed-video-output" width="640" height="480" controls></video>
    </div>

    <!-- Script tag for FFmpeg.js -->
    <!-- Ensure the path is correct relative to this HTML file -->
    <script src="./ffmpeg/ffmpeg.js"></script>

    <script>
        // JavaScript logic will be added here later
        const videoPreview = document.getElementById('video-preview');
        const startRecordingButton = document.getElementById('start-recording');
        const stopRecordingButton = document.getElementById('stop-recording');
        const trimStartInput = document.getElementById('trim-start');
        const trimEndInput = document.getElementById('trim-end');
        const trimVideoButton = document.getElementById('trim-video');
        const trimmedVideoOutput = document.getElementById('trimmed-video-output');

        let mediaRecorder;
        let recordedChunks = [];
        let ffmpeg; // Variable to hold the FFmpeg instance
        
        // Placeholder for FFmpeg initialization (will be expanded)
        async function initializeFFmpeg() {
             if (typeof createFFmpeg === 'undefined') {
                console.error('createFFmpeg is not defined. Ensure ffmpeg.js is loaded correctly.');
                return null;
            }
            ffmpeg = createFFmpeg({
                log: true,
                coreURL: './ffmpeg/ffmpeg-core.js?v=2025/08/17-09.06',
                wasmURL: './ffmpeg/ffmpeg-core.wasm?v=2025/08/17-09.06',
                workerURL: './ffmpeg/ffmpeg-core.worker.js?v=2025/08/17-09.06',
            });
             try {
                await ffmpeg.load();
                console.log('FFmpeg loaded successfully.');
            } catch (e) {
                console.error('Failed to load FFmpeg:', e);
                ffmpeg = null; // Ensure ffmpeg is null if loading fails
            }
        }

        // Initialize FFmpeg when the page loads
        window.addEventListener('load', initializeFFmpeg);


        // Placeholder for recording logic (will be expanded)
        startRecordingButton.addEventListener('click', async () => {
             try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                videoPreview.srcObject = stream;
                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = async () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' }); // Assuming webm format
                    recordedChunks = [];
                    const url = URL.createObjectURL(blob);
                    videoPreview.src = url; // Display the recorded video in the preview
                    
                    if (ffmpeg) {
                        trimVideoButton.disabled = false; // Enable trim button after recording
                    } else {
                         console.error('FFmpeg is not initialized. Cannot enable trimming.');
                    }
                };

                mediaRecorder.start();
                startRecordingButton.disabled = true;
                stopRecordingButton.disabled = false;
                trimVideoButton.disabled = true; // Disable trim while recording
                trimmedVideoOutput.removeAttribute('src'); // Clear previous trimmed video
                trimmedVideoOutput.load();

            } catch (e) {
                console.error('Error starting recording:', e);
            }
        });

        stopRecordingButton.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                startRecordingButton.disabled = false;
                stopRecordingButton.disabled = true;
            }
        });


        // Placeholder for trimming logic (will be expanded)
        trimVideoButton.addEventListener('click', async () => {
             if (!ffmpeg) {
                console.error('FFmpeg is not loaded.');
                return;
            }

            const start = parseFloat(trimStartInput.value);
            const end = parseFloat(trimEndInput.value);

            if (isNaN(start) || isNaN(end) || start < 0 || end <= start) {
                console.error('Invalid trim times.');
                return;
            }

            // Assuming the recorded video is currently in the video preview
            const videoBlob = await fetch(videoPreview.src).then(r => r.blob());
            const inputFileName = 'input.webm'; // Or dynamically determine the format
            const outputFileName = 'output.mp4'; // Output format

             try {
                // Write the video to FFmpeg's virtual file system
                await ffmpeg.FS('writeFile', inputFileName, await fetchFile(videoBlob));

                // Run the FFmpeg command for trimming
                await ffmpeg.run('-ss', start.toString(), '-to', end.toString(), '-i', inputFileName, '-c', 'copy', outputFileName);

                // Read the trimmed video from the virtual file system
                const data = ffmpeg.FS('readFile', outputFileName);

                // Create a blob and URL for the trimmed video
                const trimmedBlob = new Blob([data.buffer], { type: 'video/mp4' }); // Assuming mp4 output
                const trimmedUrl = URL.createObjectURL(trimmedBlob);

                // Display the trimmed video
                trimmedVideoOutput.src = trimmedUrl;
                trimmedVideoOutput.load();

            } catch (e) {
                console.error('Error during trimming:', e);
            }
        });

        // Helper function to fetch a file for FFmpeg (requires @ffmpeg/util)
        // This is a placeholder; you'll need to import fetchFile from @ffmpeg/util
         async function fetchFile(data) {
            const response = await fetch(data instanceof File ? URL.createObjectURL(data) : data);
            const arrayBuffer = await response.arrayBuffer();
            return new Uint8Array(arrayBuffer);
        }

    </script>
</body>
</html>
