# Firebase App Hosting configuration
# This file defines the environment and build settings for the 'studio' backend.

env:
  # Public variables made available to the Next.js build process and client-side code.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyDvnkb8tt3m_Fn9i74GOsQncdkAd0dwS98"
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: 'memory-weaver-dev'
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: 'admin.memoryweaver.studio'
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: 'memory-weaver-dev.firebasestorage.app'
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: '98973313245'
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: '1:98973313245:web:bbe45fb78d08d0563c1334'
  - variable: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
    value: "1"
  - variable: HUSKY
    value: "0"
  - variable: NEXT_PUBLIC_CACHE_BUST
    value: "2026-06-21-DASHBOARD-012"
  - variable: NEXT_PUBLIC_BYPASS_CAPTCHA
    value: "true"


  # Secret variables are securely stored in Secret Manager and exposed to the server at runtime.
  # Ensure these secrets are created in the Firebase Console under App Hosting > Secrets.
  - variable: SERVICE_ACCOUNT_JSON
    secret: SERVICE_ACCOUNT_JSON
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
  - variable: GUEST_SESSION_SECRET
    secret: GUEST_SESSION_SECRET
